# Thermal sync points for the thermal testbench, loaded with
# thermal.thermal_model.load_thermal_yaml. Each entry maps an area of
# the thermal simulator to a component path of the platform. The
# geometry rectangles and the temp_min/temp_max color-scale bounds are
# GUI heat-map hints, ignored by the model — declared here so the
# regular runs exercise the extended schema end-to-end (parse, runtime
# config dump, engine consumption).
temp_min: 25.0
temp_max: 60.0
sync_points:
  mem0:
    path: mem0
    rth: 100.0
    tau: 2.0e-6
    geometry:
      x: 0.0
      y: 0.0
      w: 2.0
      h: 1.0
  mem1:
    path: mem1
    rth: 100.0
    tau: 2.0e-6
    geometry:
      x: 2.2
      y: 0.0
      w: 2.0
      h: 1.0
